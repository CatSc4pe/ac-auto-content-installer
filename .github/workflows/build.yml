name: Build Executable Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python Setup
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller patool

    - name: Run PyInstaller Compilation Engine
      run: |
        python -m PyInstaller --noconsole --onefile "AC auto-content.py"

    - name: Upload Compiled Binary Assets
      uses: softprops/action-gh-release@v2
      with:
        files: dist/AC auto-content.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
